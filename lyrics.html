/* ------------------------------ */
/* ESTILOS DE ESCRITORIO (POR DEFECTO)      */
/* ------------------------------ */
.mobile-box {
  width: 1000px; /* Ancho para escritorio */
  height: 1000px; /* Altura para escritorio */
  margin-left: 160px; /* Margen para posicionamiento en escritorio */
  margin-top: 100px;
  background-color: #ffffff;
  border-radius: 20px;
}

/* Estilo para el contenedor de la imagen de encabezado en Escritorio */
.header-container {
    width: 1000px;
    height: 200px; 
    overflow: hidden;
    margin: 0 auto;
}

/* La imagen dentro del contenedor de encabezado para escritorio */
.header-container img {
    width: 100%; 
    height: 100%;
    object-fit: cover; 
    object-position: 0 20%;
}


.carousel-container {
  width: 930px;
  height: 280px;
  margin-left:40px;
  border-radius: 5px;
  overflow: hidden;
  position: relative;
  
}

.carousel-track {
  display: flex;
  transition: transform 0.3s ease;
  
  /* NUEVO: PROPIEDADES PARA EL ARRASTRE TÁCTIL (MÓVIL) */
  overflow-x: auto; /* Habilita el desplazamiento horizontal nativo */
  -webkit-overflow-scrolling: touch; /* Suaviza el desplazamiento en iOS */
  scroll-snap-type: x mandatory; /* Ayuda a que se detenga en cada imagen */
  scrollbar-width: none; /* Oculta la barra de desplazamiento en Firefox */
}

/* NUEVO: Oculta la barra de desplazamiento en Chrome/Safari */
.carousel-track::-webkit-scrollbar {
  display: none;
}


.carousel-container img {
  width: 240px;
  border-radius: 2px;
  margin-top: 20px;
  margin-left: 50px; /* Margen estándar de 50px */
  flex-shrink: 0;
  scroll-snap-align: start; /* Asegura que la imagen se detenga al inicio */
}

.arrow {
  position: absolute;
  top: 45%;
  transform: translateY(-50%);
  background-color: #ffffffcc;
  border: none;
  width: 40px;
  height: 40px;
  font-size: 24px;
  color: #5287e5;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
  z-index: 1;
  transition: background-color 0.2s;
}

.arrow:hover {
  background-color: #ffffff;
}

.left-arrow {
  left: 10px;
}

.right-arrow {
  right: 10px;
}
a {
text-decoration: none;
color: inherit;
}
#busqueda {
  margin-left:85px;
  padding: 8px 12px 8px 38px; /* Espacio para el icono */
  width: 250px;
  font-size: 17px;
  font-family: "Zen Kurenaido", sans-serif;
  border: 2px solid #5287e5;
  border-radius: 20px;
  outline: none;
  background: #ffffff url('https://i.ibb.co/Kcf3DVSD/search.png') no-repeat 10px center;
  background-size: 13px;
  transition: all 0.3s ease;
}

#busqueda:focus {
  border-color: #3366cc;
  box-shadow: 0 0 8px rgba(82, 135, 229, 0.4);
}
/* ------------------------------ */
/* ESTILOS PARA CELULAR       */
/* ------------------------------ */
@media (max-width: 600px) {

  body {
    padding: 0;
    margin: 0;
  }

  /* El cuadro blanco gigante */
  .mobile-box {
    width: 90% !important; 
    margin-left: 5% !important; 
    margin-top: 20px !important;
    height: auto !important;
    padding-bottom: 30px;
    border-radius: 15px;
  }

  /* Contenedor de la imagen de encabezado en Móvil */
  .header-container {
      width: 100% !important; 
      height: 160px !important; 
      margin: 0 auto !important;
      overflow: hidden !important; 
  }

  h1 {
    text-align: center !important;
    margin-left: 0 !important;
  }

  /* Imagen header - ZOOM Y MOVIMIENTO APLICADOS */
  .header-container img { 
    width: 100% !important; 
    height: 100% !important; 
    object-fit: cover; 
    object-position: 0 -20%; 
    
    /* PROPIEDAD DE ZOOM LITERAL */
    transform: scale(1.5) translateX(-15%) !important; 
  }
  
  /* Carrusel */
  .carousel-container {
    width: 100% !important;
    height: 180px !important;
    margin-left: 0 !important;
  }

  .carousel-track img {
    width: 160px !important;
    margin-left: 10px !important;
    margin-top: 15px !important;
  }

  .arrow {
    display: none !important;
  }

  /* Buscador */
  #busqueda {
    width: 70% !important;
    margin-left: 15% !important;
  }

  /* Lista */
  #lista h1 {
    font-size: 18px !important;
    margin-left: 10px !important;
  }

}
</style>

<script>
const scrollIndexes = {
  carouselTrack1: 0,
  carouselTrack2: 0
};

// Se ajusta el cálculo del ancho de la tarjeta para móvil si es necesario
const isMobile = window.matchMedia("(max-width: 600px)").matches;
// El ancho de la tarjeta es consistente: 240px (imagen) + 50px (margen) = 290px en desktop
const cardWidth = isMobile ? (160 + 10) : (240 + 50); 

function scrollCarousel(trackId, direction) {
  const track = document.getElementById(trackId);
  const maxScroll = track.children.length - (isMobile ? 2 : 3); // 2 o 3 imágenes visibles
  scrollIndexes[trackId] += direction;

  if (scrollIndexes[trackId] < 0) scrollIndexes[trackId] = 0;
  if (scrollIndexes[trackId] > maxScroll) scrollIndexes[trackId] = maxScroll;

  track.style.transform = `translateX(-${scrollIndexes[trackId] * cardWidth}px)`;
}

document.getElementById("busqueda").addEventListener("input", function () {
  const filtro = this.value.trim().toLowerCase();
  const elementos = document.querySelectorAll("#lista h1");

  elementos.forEach(h1 => {
    const alt = (h1.getAttribute("alt") || "").toLowerCase();

    // Mostrar solo si empieza con el texto buscado
    if (alt.startsWith(filtro) || filtro === "") {
      h1.style.display = "";
    } else {
      h1.style.display = "none";
    }
  });
});
</script>
