<script>
const scrollIndexes = {
  carouselTrack1: 0,
  carouselTrack2: 0
};

// Se ajusta el cálculo del ancho de la tarjeta para móvil si es necesario
const isMobile = window.matchMedia("(max-width: 600px)").matches;
// El ancho de la tarjeta es consistente: 240px (imagen) + 50px (margen) = 290px en desktop
const cardWidth = isMobile ? (160 + 10) : (240 + 50); 

function scrollCarousel(trackId, direction) {
  const track = document.getElementById(trackId);
  const maxScroll = track.children.length - (isMobile ? 2 : 3); // 2 o 3 imágenes visibles
  scrollIndexes[trackId] += direction;

  if (scrollIndexes[trackId] < 0) scrollIndexes[trackId] = 0;
  if (scrollIndexes[trackId] > maxScroll) scrollIndexes[trackId] = maxScroll;

  track.style.transform = `translateX(-${scrollIndexes[trackId] * cardWidth}px)`;
}

</script>
